services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: testing-only
      MYSQL_DATABASE: laravel_testing
      MYSQL_USER: laravel
      MYSQL_PASSWORD: testing-only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptesting-only"]
      interval: 3s
      timeout: 5s
      retries: 30
  tests:
    image: laravel-bootstrap-security-test
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_testing
      DB_USERNAME: laravel
      DB_PASSWORD: testing-only
